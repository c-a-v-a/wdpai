<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel</title>
  <link rel="stylesheet" href="public/styles/shared.css">
  <link rel="stylesheet" href="public/styles/admin.css">
  <script src="public/scripts/shared.js" defer></script>
  <script src="public/scripts/admin.js" defer></script>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-close" id="close-menu">✕</span>
        <h1 class="text-primary">FamBoard</h1>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="/dashboard" class="text-muted">Dashboard</a></li>
          <li><a href="/messageboard" class="text-muted">Message board</a></li>
          <li><a href="/calendar" class="text-muted">Calendar</a></li>
          <li><a href="/admin" class="text-primary">Admin panel</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-danger" id="log-out">Log out</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <span class="main-header-menu" id="menu">☰</span>
        <h1 class="text-primary">FamBoard</h1>
      </div>

      <h1 class="text-primary">Admin page</h1>

      <section>
        <h2 class="text-muted">Users</h2>
        <div class="user-card-list" id="user-card-container"></div>
        <button class="btn btn-primary" id="add-user">Add user</button>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 class="text-primary">Add user</h2>
      <form class="form" onsubmit="return false;">
        <div class="form-field">
          <label for="first-name-input" class="text-muted">First name</label><br>
          <input class="input" type="text" id="first-name-input" placeholder="First name" required>
        </div>
        <div class="form-field">
          <label for="surname-input" class="text-muted">Surname</label><br>
          <input class="input" type="text" id="surname-input" placeholder="Surname" required>
        </div>
        <div class="form-field">
          <label for="email-input" class="text-muted">Email</label><br>
          <input class="input" type="email" id="email-input" placeholder="Email" required>
        </div>
        <div class="form-field">
          <label for="password-input" class="text-muted">Password</label><br>
          <input class="input" type="password" id="password-input" placeholder="Password" required>
        </div>
        <button class="btn btn-primary" id="add-user-action">Add user</button>
      </form>
      <button class="btn btn-danger" id="cancel-action">Cancel</button>
    </div>
  </div>

  <template id="user-card-template">
    <div class="user-card">
      <span class="text-muted user-card-name"></span>
      <button class="btn user-card-action"></button>
    </div>
  </template>
</body>

</html>
