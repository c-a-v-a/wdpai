<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="stylesheet" href="public/styles/shared.css">
  <link rel="stylesheet" href="public/styles/calendar.css">
  <script src="public/scripts/shared.js" defer></script>
  <script src="public/scripts/calendar.js" defer></script>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-close" id="close-menu">✕</span>
        <h1 class="text-primary">FamBoard</h1>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="/dashboard" class="text-muted">Dashboard</a></li>
          <li><a href="/messageboard" class="text-muted">Message board</a></li>
          <li><a href="/calendar" class="text-primary">Calendar</a></li>
          <li><a href="/admin" class="text-muted">Admin panel</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-danger" id="log-out">Log out</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <span class="main-header-menu" id="menu">☰</span>
        <h1 class="text-primary">FamBoard</h1>
      </div>

      <h1 class="text-primary" id="calendar-title"></h1>
      <button class="btn btn-primary" id="add-event">Add event</button>

      <section class="calendar-container">
        <!-- Desktop Grid View -->
        <div class="calendar-grid" id="calendar-grid">
          <div class="calendar-weekday">Mon</div>
          <div class="calendar-weekday">Tue</div>
          <div class="calendar-weekday">Wed</div>
          <div class="calendar-weekday">Thu</div>
          <div class="calendar-weekday">Fri</div>
          <div class="calendar-weekday">Sat</div>
          <div class="calendar-weekday">Sun</div>
        </div>

        <!-- Mobile List View -->
        <div class="calendar-list" id="calendar-list"></div>
      </section>
    </main>
  </div>

  <template id="day-template">
    <div class="calendar-day">
      <span class="event-dot"></span>
    </div>
  </template>

  <template id="list-item-template">
    <div class="calendar-list-item">
      <span class="calendar-list-day"></span>
      <span class="calendar-list-name"></span>
      <span class="event-dot"></span>
    </div>
  </template>

  <div class="modal-overlay" id="view-events-modal">
    <div class="modal">
      <h2 class="text-primary" id="view-events-title"></h2>
      <div class="event-list" id="view-events-list"></div>
      <button class="btn btn-danger" id="view-events-close">Close</button>
    </div>
  </div>

  <template id="event-item-template">
    <div class="event-item">
      <div class="event-item-info">
        <span class="event-item-title"></span>
        <span class="event-item-description text-muted"></span>
        <span class="event-item-creator text-muted"></span>
        <span class="event-item-users text-muted"></span>
      </div>
      <button class="btn btn-primary event-item-join">Join</button>
    </div>
  </template>

  <div class="modal-overlay" id="add-event-modal">
    <div class="modal">
      <h2 class="text-primary">Add event</h2>
      <form class="form" onsubmit="return false;">
        <div class="form-field">
          <label for="title-input" class="text-muted">Title</label><br>
          <input class="input" type="text" id="title-input" placeholder="Title" required>
        </div>
        <div class="form-field">
          <label for="description-input" class="text-muted">Description</label><br>
          <input class="input" type="text" id="description-input" placeholder="Description" required>
        </div>
        <div class="form-field">
          <label for="event-date-input" class="text-muted">Event date</label><br>
          <input class="input" type="date" id="event-date-input" required>
        </div>
        <button class="btn btn-primary" id="add-event-action">Add event</button>
      </form>
      <button class="btn btn-danger" id="cancel-action">Cancel</button>
    </div>
  </div>
</body>

</html>
